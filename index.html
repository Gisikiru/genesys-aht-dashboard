<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AHT Dashboard</title>

<style>

body{
    font-family: Arial,sans-serif;
    background:#f4f6fa;
    margin:20px;
}

.container{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

h1{
    color:#003366;
    margin-top:0;
}

.filters{
    display:flex;
    gap:20px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.filters div{
    display:flex;
    flex-direction:column;
}

select{
    padding:8px;
    border-radius:6px;
    min-width:150px;
}

.summary{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#eef4ff;
    padding:15px;
    border-radius:8px;
    min-width:220px;
}

.card-value{
    font-size:28px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0059b3;
    color:white;
    padding:10px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.green{
    color:#28a745;
    font-weight:bold;
}

.red{
    color:#dc3545;
    font-weight:bold;
}

.gray{
    color:#6c757d;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>📞 AHT Comparativo</h1>

<div class="filters">

    <div>
        <label>Año:</label>
        <select id="yearSelect"></select>
    </div>

    <div>
        <label>Mes:</label>
        <select id="monthSelect"></select>
    </div>

    <div>
        <label>Fecha:</label>
        <select id="dateSelect"></select>
    </div>

</div>

<div class="summary">

    <div class="card">
        <div>AHT Promedio Seleccionado</div>
        <div class="card-value" id="avgCurrent">-</div>
    </div>

    <div class="card">
        <div>AHT Promedio Día Anterior</div>
        <div class="card-value" id="avgPrevious">-</div>
    </div>

</div>

<table>

<thead>
<tr>
<th>Agente</th>
<th>AHT Día Seleccionado</th>
<th>AHT Día Anterior</th>
<th>Diferencia</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<script>

let availableFiles=[];
let groupedFiles={};

async function loadFilesList(){

    const response=await fetch('./data/files.json');
    availableFiles=await response.json();

    buildFileStructure();
    populateYears();
}

function buildFileStructure(){

    groupedFiles={};

    availableFiles.forEach(file=>{

        const parts=file.split('/');

        const year=parts[0];
        const month=parts[1];

        if(!groupedFiles[year]){
            groupedFiles[year]={};
        }

        if(!groupedFiles[year][month]){
            groupedFiles[year][month]=[];
        }

        groupedFiles[year][month].push(file);

    });

}

function populateYears(){

    const yearSelect=document.getElementById('yearSelect');

    yearSelect.innerHTML='';

    Object.keys(groupedFiles)
        .sort()
        .forEach(year=>{

            let option=document.createElement('option');

            option.value=year;
            option.textContent=year;

            yearSelect.appendChild(option);

        });

    yearSelect.value=
        Object.keys(groupedFiles).sort().slice(-1)[0];

    yearSelect.addEventListener('change',populateMonths);

    populateMonths();
}

function populateMonths(){

    const year=document.getElementById('yearSelect').value;

    const monthSelect=document.getElementById('monthSelect');

    monthSelect.innerHTML='';

    Object.keys(groupedFiles[year])
        .sort()
        .forEach(month=>{

            let option=document.createElement('option');

            option.value=month;

            option.textContent=
                month.charAt(0).toUpperCase() +
                month.slice(1);

            monthSelect.appendChild(option);

        });

    monthSelect.value=
        Object.keys(groupedFiles[year]).sort().slice(-1)[0];

    monthSelect.addEventListener('change',populateDates);

    populateDates();
}

function populateDates(){

    const year=
        document.getElementById('yearSelect').value;

    const month=
        document.getElementById('monthSelect').value;

    const dateSelect=
        document.getElementById('dateSelect');

    dateSelect.innerHTML='';

    groupedFiles[year][month]
        .sort()
        .forEach(file=>{

            let option=document.createElement('option');

            option.value=file;

            option.textContent=
                file.split('/').pop().replace('.csv','');

            dateSelect.appendChild(option);

        });

    dateSelect.selectedIndex=
        dateSelect.options.length-1;

    dateSelect.onchange=loadDashboard;

    loadDashboard();
}

function secondsToText(value){

    if(value===null || value===undefined || isNaN(value)){
        return "-";
    }

    let totalSeconds;

    if(value > 100000){
        totalSeconds = Math.round(value / 1000);
    }
    else{
        totalSeconds = Math.round(value);
    }

    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;

    return `${m}m ${s}s`;
}

async function loadCsv(path){

    const resp=await fetch(path);

    const text=await resp.text();

    const lines=text
        .split('\n')
        .filter(x=>x.trim());

    const headers=parseCSV(lines[0]);

    const rows=[];

    for(let i=1;i<lines.length;i++){

        const values=parseCSV(lines[i]);

        const row={};

        headers.forEach((h,index)=>{
            row[h]=values[index];
        });

        rows.push(row);
    }

    return rows;
}

function parseCSV(line){

    const result=[];
    let current="";
    let inside=false;

    for(let i=0;i<line.length;i++){

        const char=line[i];

        if(char === '"'){
            inside=!inside;
        }
        else if(char===',' && !inside){
            result.push(current);
            current="";
        }
        else{
            current+=char;
        }
    }

    result.push(current);

    return result;
}

function buildMap(rows){

    const map={};

    rows.forEach(r=>{

        const name =
            String(r["Agent Name"] || "")
            .trim();

        const raw =
            String(r["Avg Handle"] || "")
            .replace(/,/g,'')
            .trim();

        const value = parseFloat(raw);

        if(name && !isNaN(value)){
            map[name]=value;
        }

    });

    return map;
}

async function loadDashboard(){

    const currentFile =
        document.getElementById("dateSelect").value;

    const currentIndex =
        availableFiles.indexOf(currentFile);

    const previousFile =
        availableFiles[currentIndex - 1];

    const currentRows =
        await loadCsv('./data/' + currentFile);

    const currentMap =
        buildMap(currentRows);

    let previousMap={};

    if(previousFile !== undefined){

        const previousRows =
            await loadCsv('./data/' + previousFile);

        previousMap =
            buildMap(previousRows);
    }

    const currentValues=
        Object.values(currentMap);

    const previousValues=
        Object.values(previousMap);

    const avgCurrent=
        currentValues.length
        ? currentValues.reduce((a,b)=>a+b,0) / currentValues.length
        : 0;

    const avgPrevious=
        previousValues.length
        ? previousValues.reduce((a,b)=>a+b,0) / previousValues.length
        : 0;

    document.getElementById("avgCurrent").textContent =
        secondsToText(avgCurrent);

    document.getElementById("avgPrevious").textContent =
        previousValues.length
            ? secondsToText(avgPrevious)
            : "-";

    const tbody =
        document.getElementById("tableBody");

    tbody.innerHTML='';

    Object.keys(currentMap)
        .sort()
        .forEach(agent=>{

            const current =
                currentMap[agent];

            const previous =
                Object.prototype.hasOwnProperty.call(previousMap, agent)
                ? previousMap[agent]
                : undefined;

            let diffCell =
                '<span class="gray">N/A</span>';

            if(previous !== undefined){

                const diff =
                    current - previous;

                const absDiff =
                    Math.abs(diff);

                const diffSeconds =
                    absDiff / 1000;

                const mins =
                    Math.floor(diffSeconds / 60);

                const secs =
                    Math.floor(diffSeconds % 60);

                if(diff < 0){

                    diffCell =
                    `<span class="green">▼ -${mins}m ${secs}s</span>`;
                }
                else if(diff > 0){

                    diffCell =
                    `<span class="red">▲ +${mins}m ${secs}s</span>`;
                }
                else{

                    diffCell =
                    `<span class="gray">▬ 0s</span>`;
                }
            }

            tbody.innerHTML += `
                <tr>
                    <td>${agent}</td>
                    <td>${secondsToText(current)}</td>
                    <td>${
                        previous !== undefined
                        ? secondsToText(previous)
                        : '-'
                    }</td>
                    <td>${diffCell}</td>
                </tr>
            `;
        });

}

loadFilesList();

</script>

</body>
</html>
