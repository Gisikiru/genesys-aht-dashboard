<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AHT Comparativo</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f7f9fc;
    margin:0;
    padding:20px;
}

.container{
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h2{
    margin-top:0;
    color:#003366;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0059b3;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #e0e0e0;
}

.green{
    color:#28a745;
    font-weight:bold;
}

.red{
    color:#dc3545;
    font-weight:bold;
}

.neutral{
    color:#666;
    font-weight:bold;
}

.card{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.metric{
    flex:1;
    background:#eef4ff;
    border-left:5px solid #0059b3;
    padding:15px;
    border-radius:8px;
}

.metric-value{
    font-size:24px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h2>📞 AHT Comparativo Hoy vs Ayer</h2>

<div class="card">

    <div class="metric">
        <div>AHT Promedio Hoy</div>
        <div class="metric-value">06:45</div>
    </div>

    <div class="metric">
        <div>AHT Promedio Ayer</div>
        <div class="metric-value">07:03</div>
    </div>

</div>

<table>

<thead>
<tr>
    <th>Agente</th>
    <th>AHT Hoy</th>
    <th>AHT Ayer</th>
    <th>Diferencia</th>
</tr>
</thead>

<tbody>

<tr>
    <td>Juan Pérez</td>
    <td>07:20</td>
    <td>06:45</td>
    <td class="red">▲ +35s</td>
</tr>

<tr>
    <td>María López</td>
    <td>05:50</td>
    <td>06:30</td>
    <td class="green">▼ -40s</td>
</tr>

<tr>
    <td>Carlos Ruiz</td>
    <td>06:10</td>
    <td>06:10</td>
    <td class="neutral">━ 0s</td>
</tr>

</tbody>

</table>

</div>

</body>
</html>
